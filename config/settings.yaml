# Configuración del Sistema de Análisis V16
version: "1.0.1"
environment: "development"

api_endpoints:
  dgt_map: "https://mapabalizasv16.es/#mapa"
  dgt_api: "https://etraffic.dgt.es/etrafficWEB/"
  # Endpoints reales conocidos
  known_endpoints:
    - "https://mapabalizasv16.es/api/incidents"
    - "https://mapa.dgt.es/incidencias"

security:
  rate_limit: 10  # requests por minuto
  timeout: 30     # segundos
  retry_attempts: 3
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

data_handling:
  anonymization:
    enabled: true
    gps_precision: 2  # decimales para coordenadas
    time_delay: 15    # minutos de retraso en publicación
  storage:
    max_days: 30
    encryption: false
    backup_frequency: "daily"

logging:
  level: "INFO"
  file: "logs/analysis.log"
  max_size: "100MB"
  backup_count: 5

notifications:
  alert_threshold: 10  # incidentes en 10km radius
  email_alerts: false
  webhook_url: ""  # Slack/Discord webhook
